name: Normalize older Freeda portable roots
on:
  push:
    branches: [codex/older-package-review-20261009]
    paths: ['.github/workflows/older-package-review.yml']
permissions:
  contents: write
concurrency:
  group: normalize-freeda-older-portable-roots
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate unchanged payloads and replace older release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/normalize_older_release_roots.py
      - name: Preserve previous release downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previous-freeda-1.0-and-1.1-packages
          path: previous-packages/**/*
          retention-days: 14
          if-no-files-found: warn
