name: Build Freeda 1.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: [v1.2]
    paths-ignore:
      - '.github/workflows/refresh-verified-packages.yml'
      - '.github/workflows/publish-verified.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/package-layout-audit.yml'
      - '.github/workflows/normalize-package-names.yml'
      - 'scripts/refresh_verified_packages.py'
      - 'scripts/verified-package-update.json'
      - 'scripts/package-layout-audit.py'
      - 'scripts/package-layout-audit.json'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Build and test Windows release
        shell: pwsh
        run: .\build_windows.ps1
      - name: Test desktop export and crop persistence
        shell: pwsh
        run: |
          foreach ($test in @('gui_feedback_smoke.py', 'gui_navigation_smoke.py', 'gui_web_crop_smoke.py', 'gui_remember_crops_smoke.py', 'gui_window_smoke.py', 'gui_long_names_smoke.py', 'gui_print_fill_smoke.py', 'gui_metadata_smoke.py', 'gui_consistency_smoke.py', 'gui_cards_smoke.py', 'gui_logos_smoke.py', 'gui_recursive_batch_smoke.py', 'gui_views_smoke.py')) {
            & .\.venv-build\Scripts\python.exe scripts/check_gui.py "tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "GUI check failed: $test" }
          }
          & .\.venv-build\Scripts\python.exe scripts/smoke_binary.py dist/Freeda/Freeda.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native startup failed.' }
          & .\.venv-build\Scripts\python.exe scripts/check_packaged_tools.py dist/Freeda/Freeda.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged ExifTool check failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Freeda_1.2_Windows_x64
          path: release/Freeda_1.2_Windows_x64.zip
          if-no-files-found: error

  publish-windows:
    needs: windows
    if: github.ref == 'refs/tags/v1.2'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Freeda_1.2_Windows_x64
          path: artifacts
      - name: Publish Windows 1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum *.zip > SHA256SUMS.txt
          cd ..
          if gh release view v1.2 >/dev/null 2>&1; then
            gh release edit v1.2 --draft --title 'Freeda 1.2' --notes-file RELEASE_NOTES_1.2.md
            gh release upload v1.2 artifacts/* --clobber
          else
            gh release create v1.2 artifacts/* --draft --verify-tag --title 'Freeda 1.2' --notes-file RELEASE_NOTES_1.2.md
          fi

  unix:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: Linux_x64
          - runner: macos-15
            label: macOS_AppleSilicon
          - runner: macos-15-intel
            label: macOS_Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth fonts-dejavu-core
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare portable ExifTool
        run: python scripts/prepare_exiftool.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Linux desktop crop and export checks
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python scripts/check_gui.py tests/gui_feedback_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_web_crop_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_remember_crops_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_print_fill_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_metadata_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_consistency_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_recursive_batch_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_cards_smoke.py
          xvfb-run -a python scripts/check_gui.py tests/gui_logos_smoke.py
          xvfb-run -a -s "-screen 0 2560x1920x24" python scripts/check_gui.py tests/gui_views_smoke.py
      - name: Check family UI colors, settings and scaling
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 2560x1920x24" python scripts/check_family_ui.py
      - name: Build native archive
        run: python scripts/build_unix.py --label '${{ matrix.label }}'
      - name: Linux binary startup
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python scripts/smoke_binary.py dist/Freeda/Freeda
          python scripts/check_packaged_tools.py dist/Freeda/Freeda
      - name: macOS binary startup
        if: runner.os == 'macOS'
        run: |
          python scripts/smoke_binary.py dist/Freeda.app/Contents/MacOS/Freeda
          python scripts/check_packaged_tools.py dist/Freeda.app/Contents/MacOS/Freeda
      - uses: actions/upload-artifact@v4
        with:
          name: Freeda_1.2_${{ matrix.label }}
          path: release/Freeda_1.2_${{ matrix.label }}.*
          if-no-files-found: error

  publish-unix:
    needs: [publish-windows, unix]
    if: github.ref == 'refs/tags/v1.2'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Freeda_1.2_*
          path: artifacts
          merge-multiple: true
      - name: Attach Linux and macOS builds and complete checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cd ..
          gh release upload v1.2 artifacts/Freeda_1.2_Linux_x64.tar.gz artifacts/Freeda_1.2_macOS_AppleSilicon.zip artifacts/Freeda_1.2_macOS_Intel.zip artifacts/SHA256SUMS.txt --clobber

          gh release edit v1.2 --draft=false --latest
